[package]
name = "stackenv"
version = "0.1.1"
edition = "2024"
authors = ["sanayasfp"]
description = "Native, zero-container multi-project dev environment manager. No Docker, no VMs."
license = "MIT OR Apache-2.0"
repository = "https://github.com/sanayasfp/stack"

[[bin]]
name = "stack"
path = "src/main.rs"

[package.metadata.wix]
upgrade-guid = "CA26EDDD-8AFC-435E-99F2-595B7EFB3B84"
path-guid = "C262B3D2-B4EA-47A6-B258-A5EF3BCC2C25"
license = false
eula = false

[dependencies]
anyhow = "1"
clap = { version = "4.6.4", features = ["derive"] }
dialoguer = "0.12.0"
dirs = "6.0.0"
dotenvy = "0.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shell-words = "1.1.1"
sysinfo = "0.39.6"
toml = "1.1.3"
toml_edit = "0.25.13"
ureq = { version = "3.3.0", features = ["json"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
